name: sss-release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sss:
    name: Build sss (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
          - os: macos-latest
            target: x86_64-apple-darwin
            builder: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo-zigbuild

    steps:
      - name: Check out sss
        uses: actions/checkout@v4

      - name: Install Rust toolchain for sss
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate sss release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid --package sss | sed -E 's/.*#([^@]+@)?//')"
          test "$tag_version" = "$package_version" || {
            echo "sss tag $GITHUB_REF_NAME does not match Cargo package version $package_version" >&2
            exit 1
          }

      - name: Install Zig for sss Linux cross-builds
        if: matrix.builder == 'cargo-zigbuild'
        shell: bash
        run: |
          set -euo pipefail
          zig_arch="$(case "$(uname -m)" in
            x86_64|amd64) echo x86_64 ;;
            aarch64|arm64) echo aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac)"
          zig_os="$(case "$(uname -s)" in
            Linux) echo linux ;;
            Darwin) echo macos ;;
            *) echo "unsupported runner OS: $(uname -s)" >&2; exit 1 ;;
          esac)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://ziglang.org/download/0.15.2/zig-${zig_arch}-${zig_os}-0.15.2.tar.xz" \
            | tar -xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-${zig_arch}-${zig_os}-0.15.2" >> "${GITHUB_PATH}"

      - name: Install cargo-zigbuild for sss Linux cross-builds
        if: matrix.builder == 'cargo-zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Test sss on the runner
        run: |
          cargo test --locked
          cargo build --locked
          python3 tests/e2e.py target/debug/sss

      - name: Build and package sss
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.builder }}" = "cargo-zigbuild" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}" --bin sss
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin sss
          fi

          archive="sss-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          staging="${RUNNER_TEMP}/sss-package-${{ matrix.target }}"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/sss" "$staging/sss"
          chmod 755 "$staging/sss"
          tar -C "$staging" -czf "$archive" sss

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Attest sss build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sss-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - name: Stage sss attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "sss-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sigstore.json"

      - name: Upload sss package
        uses: actions/upload-artifact@v4
        with:
          name: sss-${{ matrix.target }}
          path: |
            sss-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            sss-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
            sss-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sigstore.json
          if-no-files-found: error

  publish-sss:
    name: Publish sss GitHub Release
    runs-on: ubuntu-latest
    needs: build-sss
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download sss packages
        uses: actions/download-artifact@v4
        with:
          pattern: sss-*
          merge-multiple: true

      - name: Create sss checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha256sum sss-"${tag}"-*.tar.gz > "sss-${tag}-checksums.txt"

      - name: Attest sss checksum manifest
        id: attest-manifest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sss-${{ github.ref_name }}-checksums.txt

      - name: Stage sss manifest attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest-manifest.outputs.bundle-path }}" \
            "sss-${{ github.ref_name }}-checksums.txt.sigstore.json"

      - name: Publish sss GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: sss-*
