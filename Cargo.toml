[package]
name = "sss"
version = "0.1.0"
edition = "2021"
description = "Simple Static Server: atomic static publishing in one binary"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
fs2 = "0.4"
ignore = "0.4"
mime_guess = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
walkdir = "2"

tempfile = "3"
semver = "1"
flate2 = "1"
tar = "0.4"
attestation-verify = { git = "https://github.com/combinatrix-ai/attestation-verify", rev = "73d3b53ecbf2d3c71846ae4cab3fa6482be012eb" }
